global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ledgerguard-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['ledgerguard-api:8080']
        labels:
          application: 'ledgerguard-api'
          environment: 'production-compose'
