spring:
  application:
    name: ledgerguard-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${LEDGERGUARD_DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${LEDGERGUARD_DB_USER:ledgerguard_app}
    password: ${LEDGERGUARD_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

ledgerguard:
  security:
    jwt:
      issuer: ledgerguard
      access-token-ttl: 900s
      refresh-token-ttl: 604800s
      secret: ${LEDGERGUARD_JWT_SECRET:}
    cookie:
      secure: true
    cors:
      allowed-origins: ${LEDGERGUARD_CORS_ALLOWED_ORIGINS:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
