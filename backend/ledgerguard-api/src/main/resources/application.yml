spring:
  application:
    name: ledgerguard-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${LEDGERGUARD_DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${LEDGERGUARD_DB_USER:ledgerguard_app}
    password: ${LEDGERGUARD_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${LEDGERGUARD_DB_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${LEDGERGUARD_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

ledgerguard:
  kafka:
    domain-events-topic: ${LEDGERGUARD_DOMAIN_EVENTS_TOPIC:ledgerguard.domain-events.v1}
    partitions: ${LEDGERGUARD_DOMAIN_EVENTS_PARTITIONS:3}
    replication-factor: ${LEDGERGUARD_DOMAIN_EVENTS_REPLICATION_FACTOR:1}
  outbox:
    publisher:
      enabled: ${LEDGERGUARD_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${LEDGERGUARD_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
      batch-size: ${LEDGERGUARD_OUTBOX_PUBLISHER_BATCH_SIZE:50}
      send-timeout-ms: ${LEDGERGUARD_OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${PSP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PSP_READ_TIMEOUT_MS:2000}
    webhook-url: ${PSP_WEBHOOK_URL:http://localhost:8080/api/provider/webhooks}
    webhook:
      secret: ${PSP_WEBHOOK_SECRET:}
      max-clock-skew-seconds: ${PSP_WEBHOOK_MAX_CLOCK_SKEW_SECONDS:300}
    polling:
      enabled: ${LEDGERGUARD_PSP_POLLING_ENABLED:true}
      interval-ms: ${LEDGERGUARD_PSP_POLLING_INTERVAL_MS:5000}
      max-attempts: ${LEDGERGUARD_PSP_POLLING_MAX_ATTEMPTS:10}
      retry-delay-seconds: ${LEDGERGUARD_PSP_POLLING_RETRY_DELAY_SECONDS:5}
      batch-size: ${LEDGERGUARD_PSP_POLLING_BATCH_SIZE:10}
  resilience:
    retry:
      create:
        max-attempts: ${LEDGERGUARD_RESILIENCE_RETRY_CREATE_MAX_ATTEMPTS:3}
        initial-backoff: 200ms
        multiplier: 2.0
        max-backoff: 400ms
        jitter-factor: 0.20
      status:
        max-attempts: ${LEDGERGUARD_RESILIENCE_RETRY_STATUS_MAX_ATTEMPTS:3}
        initial-backoff: 100ms
        multiplier: 2.0
        max-backoff: 200ms
        jitter-factor: 0.20
    bulkhead:
      create:
        max-concurrent-calls: ${LEDGERGUARD_RESILIENCE_BULKHEAD_CREATE_CONCURRENCY:20}
        max-wait-duration: 0ms
      status:
        max-concurrent-calls: ${LEDGERGUARD_RESILIENCE_BULKHEAD_STATUS_CONCURRENCY:20}
        max-wait-duration: 0ms
    circuit-breaker:
      name: psp-remote
      sliding-window-size: ${LEDGERGUARD_RESILIENCE_CB_WINDOW_SIZE:20}
      minimum-number-of-calls: ${LEDGERGUARD_RESILIENCE_CB_MIN_CALLS:10}
      failure-rate-threshold: ${LEDGERGUARD_RESILIENCE_CB_FAILURE_THRESHOLD:50.0}
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 5
      automatic-transition-from-open-to-half-open-enabled: false
  reconciliation:
    cron: ${LEDGERGUARD_RECONCILIATION_CRON:0 0 2 * * *}
  security:
    jwt:
      issuer: ledgerguard
      access-token-ttl: 900s
      refresh-token-ttl: 604800s
      secret: ${LEDGERGUARD_JWT_SECRET:}
    cookie:
      secure: true
    cors:
      allowed-origins: ${LEDGERGUARD_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    enabled: ${LEDGERGUARD_RATE_LIMIT_ENABLED:true}
    store:
      max-entries: ${LEDGERGUARD_RATE_LIMIT_STORE_MAX_ENTRIES:10000}
      idle-ttl: ${LEDGERGUARD_RATE_LIMIT_STORE_IDLE_TTL:1h}
    policy:
      public-auth:
        capacity: ${LEDGERGUARD_RATE_LIMIT_PUBLIC_AUTH_CAPACITY:10}
        refill-tokens: ${LEDGERGUARD_RATE_LIMIT_PUBLIC_AUTH_REFILL_TOKENS:10}
        refill-period: ${LEDGERGUARD_RATE_LIMIT_PUBLIC_AUTH_REFILL_PERIOD:1m}
      financial-write:
        capacity: ${LEDGERGUARD_RATE_LIMIT_FINANCIAL_WRITE_CAPACITY:20}
        refill-tokens: ${LEDGERGUARD_RATE_LIMIT_FINANCIAL_WRITE_REFILL_TOKENS:20}
        refill-period: ${LEDGERGUARD_RATE_LIMIT_FINANCIAL_WRITE_REFILL_PERIOD:1m}
      ops:
        capacity: ${LEDGERGUARD_RATE_LIMIT_OPS_CAPACITY:30}
        refill-tokens: ${LEDGERGUARD_RATE_LIMIT_OPS_REFILL_TOKENS:30}
        refill-period: ${LEDGERGUARD_RATE_LIMIT_OPS_REFILL_PERIOD:1m}
      authenticated-general:
        capacity: ${LEDGERGUARD_RATE_LIMIT_AUTHENTICATED_GENERAL_CAPACITY:50}
        refill-tokens: ${LEDGERGUARD_RATE_LIMIT_AUTHENTICATED_GENERAL_REFILL_TOKENS:50}
        refill-period: ${LEDGERGUARD_RATE_LIMIT_AUTHENTICATED_GENERAL_REFILL_PERIOD:1m}
  metrics:
    integrity:
      sample-interval: ${LEDGERGUARD_METRICS_INTEGRITY_SAMPLE_INTERVAL:15s}
      scheduler-enabled: ${LEDGERGUARD_METRICS_INTEGRITY_SCHEDULER_ENABLED:true}

server:
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
      max-queue-capacity: ${SERVER_TOMCAT_THREADS_MAX_QUEUE_CAPACITY:50}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:1000}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
