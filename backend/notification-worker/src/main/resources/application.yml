spring:
  application:
    name: notification-worker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${NOTIFICATION_DB_NAME:notification_worker}
    username: ${NOTIFICATION_DB_USER:notification_worker_app}
    password: ${NOTIFICATION_DB_PASSWORD:notification_worker_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NotificationWorkerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ledgerguard-notification-worker-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

ledgerguard:
  kafka:
    domain-events-topic: ledgerguard.domain-events.v1
    domain-events-dlt-topic: ledgerguard.domain-events.v1.DLT
    retry:
      backoff-ms: 100
      max-attempts: 2
