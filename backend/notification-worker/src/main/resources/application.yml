spring:
  application:
    name: notification-worker

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${NOTIFICATION_DB_NAME:notification_worker}
    username: ${NOTIFICATION_DB_USER:notification_worker_app}
    password: ${NOTIFICATION_DB_PASSWORD:notification_worker_dev_pw}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NotificationWorkerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ledgerguard-notification-worker-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${NOTIFICATION_KAFKA_MAX_POLL_RECORDS:10}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: ${NOTIFICATION_KAFKA_CONCURRENCY:3}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
            required: ${MAIL_STARTTLS_REQUIRED:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

ledgerguard:
  kafka:
    domain-events-topic: ledgerguard.domain-events.v1
    domain-events-dlt-topic: ledgerguard.domain-events.v1.DLT
    retry:
      backoff-ms: 100
      max-attempts: 2
  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@ledgerguard.local}
      from-name: ${MAIL_FROM_NAME:LedgerGuard}
      reply-to: ${MAIL_REPLY_TO:}
    dispatcher:
      batch-size: ${NOTIFICATION_DISPATCHER_BATCH_SIZE:20}
      poll-interval-ms: ${NOTIFICATION_DISPATCHER_POLL_INTERVAL_MS:1000}
      lease-duration-seconds: ${NOTIFICATION_DISPATCHER_LEASE_SECONDS:120}
      max-attempts: ${NOTIFICATION_DISPATCHER_MAX_ATTEMPTS:5}
      initial-retry-delay-seconds: ${NOTIFICATION_DISPATCHER_INITIAL_DELAY_SECONDS:30}
      max-retry-delay-seconds: ${NOTIFICATION_DISPATCHER_MAX_DELAY_SECONDS:600}

management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: [w3c]
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"
