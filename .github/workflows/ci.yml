name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and verify backend reactor
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/ledgerguard-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/ledgerguard-web
        run: npm ci

      - name: Run lint
        working-directory: frontend/ledgerguard-web
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend/ledgerguard-web
        run: npm run build

  financial-integrity:
    name: Financial Integrity & Failure Scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Prepare LedgerGuard API dependency
        run: ./mvnw -B -ntp -pl backend/ledgerguard-api -am install -DskipTests

      - name: Execute financial failure scenarios
        run: ./mvnw -B -ntp -f backend/failure-lab/pom.xml clean test -Pfinancial-failure-ci

      - name: Publish financial integrity summary to Step Summary
        if: always()
        run: |
          echo "## Financial Integrity Maven Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gate Status:** \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Maven job status is authoritative for the complete Phase 38 gate." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f backend/failure-lab/target/financial-integrity-summary.md ]; then
            cat backend/failure-lab/target/financial-integrity-summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### LedgerGuard Financial Integrity CI" >> $GITHUB_STEP_SUMMARY
            echo "Financial integrity summary report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload financial integrity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: financial-integrity-report
          path: |
            backend/failure-lab/target/financial-integrity-report.json
            backend/failure-lab/target/financial-integrity-summary.md
          retention-days: 14
          if-no-files-found: error

  docker-images:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend, financial-integrity]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build ledgerguard-api image
        run: docker build -t ledgerguard-api:ci -f backend/ledgerguard-api/Dockerfile .

      - name: Build psp-simulator image
        run: docker build -t psp-simulator:ci -f backend/psp-simulator/Dockerfile .

      - name: Build notification-worker image
        run: docker build -t notification-worker:ci -f backend/notification-worker/Dockerfile .

      - name: Build ledgerguard-web image
        run: docker build -t ledgerguard-web:ci --build-arg VITE_API_BASE_URL=/ -f frontend/ledgerguard-web/Dockerfile frontend/ledgerguard-web
