name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and verify backend reactor
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/ledgerguard-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/ledgerguard-web
        run: npm ci

      - name: Run lint
        working-directory: frontend/ledgerguard-web
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend/ledgerguard-web
        run: npm run build

  docker-images:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build ledgerguard-api image
        run: docker build -t ledgerguard-api:ci -f backend/ledgerguard-api/Dockerfile .

      - name: Build psp-simulator image
        run: docker build -t psp-simulator:ci -f backend/psp-simulator/Dockerfile .

      - name: Build notification-worker image
        run: docker build -t notification-worker:ci -f backend/notification-worker/Dockerfile .

      - name: Build ledgerguard-web image
        run: docker build -t ledgerguard-web:ci --build-arg VITE_API_BASE_URL=/ -f frontend/ledgerguard-web/Dockerfile frontend/ledgerguard-web
